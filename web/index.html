<!doctype html>
<html lang="en" data-theme="light" data-palette="aubergine">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDET Interview Playground</title>
  <meta name="description" content="330 interview problems, a 170-entry cheat sheet, 500 SQL questions on an in-browser PostgreSQL and a code playground for SDET and QA engineers, in Python, JavaScript, TypeScript and SQL.">
  <meta name="author" content="Vijayanand Puppala (Vijay-puppala)">
  <meta property="og:title" content="SDET Interview Playground">
  <meta property="og:description" content="Python, JavaScript, TypeScript and SQL practice for SDET and QA engineers. Runs entirely in your browser.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233f0e40'/%3E%3Cpath d='M10 11l-4 5 4 5M22 11l4 5-4 5M18 9l-4 14' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/lato-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lato-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Apply light / dark (from the system setting) and the saved colour theme before first paint to avoid a flash.
    (function () {
      var get = function (k) { try { var v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } };
      var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
      var root = document.documentElement;
      root.setAttribute("data-theme", dark ? "dark" : "light");
      root.setAttribute("data-palette", get("qa.palette") || "aubergine");
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="home">
  <div class="app">
    <header class="topbar">
      <button class="icon-btn on-top menu-btn" id="menuBtn" aria-label="Open the list" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="searchbox" id="quickBtn" aria-label="Search everything (Ctrl+K)">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="sb-text">Search problems, cheat sheet…</span><kbd>Ctrl K</kbd>
      </button>
      <div class="tb-right">
        <div class="seg" id="langSeg" role="radiogroup" aria-label="Language">
          <button role="radio" data-lang="py" aria-label="Python"><span class="long">Python</span><span class="short">PY</span></button>
          <button role="radio" data-lang="js" aria-label="JavaScript"><span class="long">JavaScript</span><span class="short">JS</span></button>
          <button role="radio" data-lang="ts" aria-label="TypeScript"><span class="long">TypeScript</span><span class="short">TS</span></button>
        </div>
        <div class="pop-wrap">
          <button class="icon-btn on-top" id="paletteBtn" aria-label="Colour theme" aria-haspopup="dialog" aria-expanded="false" title="Colour theme">
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M12 3a9 9 0 100 18c1.4 0 2-1 1.6-2-.5-1.3.4-2.5 1.9-2.5H18a3 3 0 003-3C21 7 17 3 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7.5" r="1.2" fill="currentColor"/><circle cx="15" cy="8" r="1.2" fill="currentColor"/></svg>
          </button>
          <div class="popover" id="palette" role="dialog" aria-label="Colour theme" hidden></div>
        </div>
      </div>
    </header>

    <nav class="rail" aria-label="Sections">
      <a class="logo" href="#home" id="brand" aria-label="SDET Interview Playground home" title="SDET Interview Playground">&lt;/&gt;</a>
      <button class="tab rail-item" data-view="home" aria-label="Home">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Home</span></button>
      <button class="tab rail-item" data-view="problems" aria-label="Problems">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3.5 6l1.2 1.2L7 4.9M3.5 12l1.2 1.2L7 10.9M3.5 18l1.2 1.2L7 16.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Problems</span></button>
      <button class="tab rail-item" data-view="cheatsheet" aria-label="Cheat sheet">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 3h12a1 1 0 011 1v17l-7-4-7 4V4a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Cheats</span></button>
      <button class="tab rail-item" data-view="sql" aria-label="SQL">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><ellipse cx="12" cy="6" rx="7.5" ry="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>SQL</span></button>
      <button class="tab rail-item" data-view="playground" aria-label="Playground">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 10l3 2.5L7 15M12.5 15H17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Play</span></button>
    </nav>

    <aside class="sidebar" id="sidebar" aria-label="Navigation list">
      <div class="side-head">
        <h2 class="side-title" id="sideTitle">Problems</h2>
        <span class="side-sub" id="sideSub"></span>
      </div>

      <div class="side-ctx" id="ctxProblems">
        <div class="side-tools">
          <input id="search" type="search" placeholder="Filter problems" aria-label="Filter problems" autocomplete="off">
          <div class="chips" id="chips" role="group" aria-label="Categories"></div>
          <div class="progress-row">
            <div class="progress" aria-hidden="true"><div id="progressBar"></div></div>
            <span id="progressText"></span>
          </div>
          <label class="check"><input type="checkbox" id="hideSolved"> Hide solved</label>
        </div>
        <ul class="plist" id="plist"></ul>
      </div>

      <div class="side-ctx" id="ctxCheat" hidden>
        <div class="side-tools">
          <input id="csSearch" type="search" placeholder="Search the cheat sheet" aria-label="Search the cheat sheet" autocomplete="off">
        </div>
        <ul class="plist sections" id="csChips"></ul>
      </div>

      <div class="side-ctx" id="ctxSql" hidden>
        <div class="side-tools">
          <input id="sqlSearch" type="search" placeholder="Filter SQL patterns" aria-label="Filter SQL patterns" autocomplete="off">
          <div class="progress-row">
            <div class="progress" aria-hidden="true"><div id="sqlBar"></div></div>
            <span id="sqlProgText"></span>
          </div>
        </div>
        <ul class="plist" id="sqlList"></ul>
      </div>

      <div class="side-ctx" id="ctxPlay" hidden>
        <div class="side-tools"><div class="side-note">Pick a starter program. Your own edits are saved per language.</div></div>
        <ul class="plist samples" id="sampleList"></ul>
      </div>
    </aside>

    <main class="main" id="main">
      <section id="viewHome" class="view wide"></section>
      <section id="viewProblems" class="view" hidden></section>
      <section id="viewCheatsheet" class="view wide" hidden></section>
      <section id="viewSql" class="view" hidden></section>
      <section id="viewPlayground" class="view" hidden></section>
    </main>
  </div>
  <div class="scrim" id="scrim" hidden></div>

  <div class="qs" id="qs" hidden>
    <div class="qs-box" role="dialog" aria-modal="true" aria-label="Quick search">
      <div class="qs-input"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="qsInput" type="text" placeholder="Jump to a problem, cheat-sheet entry or page…" aria-label="Search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="qsList"></div>
      <ul class="qs-list" id="qsList" role="listbox"></ul>
      <div class="qs-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>

  <script src="site.js"></script>
  <script src="data/problems.js"></script>
  <script src="data/bundles.js"></script>
  <script src="data/cheatsheet.js"></script>
  <script src="data/sql_index.js"></script>
  <script src="hl.js"></script>
  <script src="runner.js"></script>
  <script src="samples.js"></script>
  <script src="sql_tab.js"></script>
  <script src="app.js"></script>
</body>
</html>
